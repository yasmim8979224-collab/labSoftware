<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Clássica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora">
        <input type="text" id="visor" readonly placeholder="0">

        <!-- Teclado da calculadora -->
        <div class="teclado">
            <!-- Linha 1 -->
            <button onclick="limpar()" class="btn-acao">C</button>
            <button>/</button>
            <button>*</button>
            <button>-</button>

            <!-- Linha 2 -->
            <button onclick="adicionar('7')">7</button>
            <button>8</button>
            <button>9</button>
            <button onclick="adicionar('+')" class="btn-operador">+</button>

            <!-- Linha 3 -->

            <button onclick="calcular()" class="btn-igual">=</button>

            <button class="btn-zero">0</button>
            <button>.</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
